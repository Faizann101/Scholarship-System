{% extends 'base.html' %}{% block title %}My profile{% endblock %}{% block content %}<div class="narrow"><div class="page-heading"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>My profile</h1><p>Keep your contact information up to date.</p></div><form class="panel form-panel" method="post"><label>Full name<input name="full_name" value="{{ user.full_name }}" required></label><label>Email address<input type="email" name="email" value="{{ user.email }}" required></label><label>Phone number<input name="phone" value="{{ user.phone }}"></label><label>Address<textarea name="address" rows="3">{{ user.address }}</textarea></label><button class="button primary">Save profile</button></form></div>{% endblock %}
